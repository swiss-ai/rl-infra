defaults: chonk-gsm8k-debug-4n-megatron.yaml

grpo:
  max_num_steps: 100
  num_prompts_per_step: 16
  num_generations_per_prompt: 16
  val_period: 0
  val_at_start: false
  val_at_end: false
  async_grpo:
    enabled: true
    max_trajectory_age_steps: 1
    in_flight_weight_updates: true

loss_fn:
  use_importance_sampling_correction: true
  truncated_importance_sampling_type: tis
  truncated_importance_sampling_ratio: 2.0

policy:
  train_global_batch_size: 256
  max_total_sequence_length: 16384
  logprob_chunk_size: 512
  sequence_packing:
    enabled: true
    train_mb_tokens: 16384
    logprob_mb_tokens: 16384
  megatron_cfg:
    defer_fp32_logits: true
    env_vars:
      NRL_HBM_BIND_CPU: "1"
      NRL_DEBUG_REFIT_ONLY: "0.01"
  generation:
    max_new_tokens: 4096
    vllm_cfg:
      enforce_eager: false
    vllm_kwargs:
      max_num_batched_tokens: 16384

data:
  train:
    dataset_name: DAPOMath17K
    deduplicate: true
  validation:
    dataset_name: DAPOMathAIME2024
  default:
    prompt_file: null
