# Task overlay: terminus-sc.yaml with OpenCode instead of Terminus-2 (run.sh: AGENT=opencode, always
# together with tunnel-sc.yaml). OpenCode runs INSIDE the task sandbox and calls the model through the
# per-sandbox reverse tunnel, sandbox 127.0.0.1:8000 -> policy_model (Gym patches 0013+0014), like
# mini-sc.yaml.
#
# Gym patches used (run.sh checks markers of 0021 and 0026):
#   0011/0012  per-rollout capture URL; capture-aware masking
#   0020/0021  upstream backport: OpenCode (AI SDK) always streams; under worker-owned capture the
#              engine call is made non-streaming, committed, and replayed to OpenCode as SSE. No byte
#              reaches OpenCode before generation ends, so its provider timeouts must stay off (0023).
#   0023-0025  OpenCodeNemoGym: pinned standalone binary (1.17.11, sha256 built in, downloaded by the
#              pod from GitHub releases), `opencode run ... </dev/null` (job 5236016 hung reading stdin),
#              no title / compaction / sub-agent calls (each extra conversation masks the rollout),
#              model limits from model_info. Keys verified against OpenCode v1.17.11; keep that version.
#   0026       opencode_workdir: OpenCode runs in the task directory (created if missing).
# Note: research/research_notes/2026-11-10-opencode-adapter-patch.md (alpernates workspace).
#
# Env (run.sh exports them when set):
#   OPENCODE_VERSION      default 1.17.11; another version needs opencode_sha256 and re-checked keys
#   OPENCODE_TIMEOUT_SEC  default 870: OpenCode is ended with exit 124 before Harbor's agent timeout
#                         (900 s micro tasks), so return-code.txt and opencode.txt are written
#   OPENCODE_DEBUG        true: --print-logs --log-level DEBUG into agent/opencode.txt (use for R1)

env:
  nemo_gym:
    harbor_agent:
      responses_api_agents:
        harbor_agent:
          harbor_agent_name: null
          harbor_agent_import_path: "responses_api_agents.harbor_agent.custom_agents.opencode_nemo_gym:OpenCodeNemoGym"
          # the tunnel's sandbox end (tunnel-sc.yaml pod_port); harbor_agent appends /ng-rollout/<id>/...
          harbor_model_base_url: http://127.0.0.1:8000
          # merged with terminus-sc.yaml's kwargs (max_turns -> agent.build.steps)
          harbor_agent_kwargs:
            version: ${oc.env:OPENCODE_VERSION,1.17.11}
            opencode_install: binary
            # oc.decode: oc.env returns strings, and bool("false") is True
            opencode_timeout_sec: ${oc.decode:${oc.env:OPENCODE_TIMEOUT_SEC,870}}
            opencode_debug: ${oc.decode:${oc.env:OPENCODE_DEBUG,false}}
            # micro tasks work in /app (their instructions say "create /app if needed"); OpenCode's project
            # is its cwd, and the exec's default (/ or $HOME) made it warn "failed to initialize fff" (5314432)
            opencode_workdir: /app
            # terminus-sc.yaml gives max_output_tokens = the whole context; OpenCode's limit.output (and
            # OPENCODE_EXPERIMENTAL_OUTPUT_TOKEN_MAX) should be the per-turn generation limit
            model_info:
              max_input_tokens: ${policy.max_total_sequence_length}
              max_output_tokens: ${policy.generation.max_new_tokens}
            # deep-merged last into OpenCode's config, e.g. {agent: {build: {prompt: "..."}}}; unknown
            # top-level keys make OpenCode reject the whole config (config/parse.ts:40-53 @ v1.17.11)
            opencode_config: {}
    policy_model:
      responses_api_models:
        vllm_model:
          # REQUIRED: OpenCode sends no top_p and temperature 0.55 for model ids containing "qwen"
          # (provider/transform.ts:482,500 @ v1.17.11); NeMo-RL's HTTP server asserts the train profile
          # (vllm_worker_async.py). Gym applies these last to every engine request (vllm_model/app.py).
          # Validation is off in terminus-sc.yaml (val_period 0), so no val profile is needed here.
          sampling_overrides:
            temperature: ${policy.generation.temperature}
            top_p: ${policy.generation.top_p}
            max_tokens: ${policy.generation.max_new_tokens}
