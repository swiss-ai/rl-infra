# Enigmata pass rates of SFT v0.2 at thinking HIGH, 16k tokens: the same 648 puzzles x 8 answers as
# task-passrate.yaml (thinking medium), with the system frame {"thinking":"high","tools":[]}. At medium, 99% of
# answers left the think frame empty and none had a claim frame (job 1276513).
# Run as task-passrate.yaml, with RUN=enigmata-passrate-sftv02-high.
defaults: recipe-sftv02-score1.yaml

score:
  num_generations: 8
  batch_prompts: 216

data:
  _override_: true
  max_input_seq_length: 2048
  shuffle: false
  num_workers: 1
  train:
    - dataset_name: ResponseDataset
      data_path: /scratch/hanint06/data/stem-rl/enigmata/sample/passrate_sample.jsonl
      env_name: enigmata
  validation: null
  default:
    prompt_file: null
    system_prompt_file: ${oc.env:RL_INFRA_DIR}/experiments/enigmata/system-thinking-high.json
    processor: apertus2_math_data_processor
    env_name: enigmata

env:
  enigmata:
    repo_dir: /scratch/hanint06/data/stem-rl/enigmata/repo
    num_workers: 8
    reward_frame: claim
    fallback_frame: reply
    timeout_s: 10.0
    hard_timeout_s: 120.0
    log_every: 1000
    stats_path: ${logger.log_dir}/enigmata_stats.jsonl
    stats_text_chars: 0
