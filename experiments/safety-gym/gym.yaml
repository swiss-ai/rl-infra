# Both native safety routes use the selected, separately served judge.
judge_model_name: ${oc.env:SAFETY_JUDGE_MODEL}
judge_base_url: ${oc.env:SAFETY_JUDGE_BASE_URL}
safety_judge_model:
  responses_api_models:
    vllm_model:
      entrypoint: app.py
      base_url: ${judge_base_url}
      api_key: ${judge_api_key}
      model: ${judge_model_name}
      return_token_id_information: false
      uses_reasoning_parser: true
judge_model:
  responses_api_models:
    openai_model:
      entrypoint: app.py
      openai_base_url: ${judge_base_url}
      openai_api_key: ${judge_api_key}
      openai_model: ${judge_model_name}

# Validation-only agent aliases. NeMo-RL logs validation/<agent>/reward per agent name, so
# each alias gives its own curve. Over-refusal = 1 - reward for the or_val_* agents.
or_val_wg_test_adversarial:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: over_refusal_detection
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: example
        type: example
        jsonl_fpath: resources_servers/over_refusal_detection/data/example.jsonl
or_val_wg_test_vanilla:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: over_refusal_detection
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: example
        type: example
        jsonl_fpath: resources_servers/over_refusal_detection/data/example.jsonl
jailbreak_val_wg_test_vanilla:
  responses_api_agents:
    simple_agent:
      max_steps: 1
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: jailbreak_detection
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: example
        type: example
        jsonl_fpath: resources_servers/jailbreak_detection/data/example.jsonl
or_val_wg_test_adversarial_environment_server:
  environment_servers:
    single_agent_turn_legacy:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: over_refusal_detection
      agent_server:
        type: responses_api_agents
        name: or_val_wg_test_adversarial
      resources_tool_transports:
      - direct_http
or_val_wg_test_vanilla_environment_server:
  environment_servers:
    single_agent_turn_legacy:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: over_refusal_detection
      agent_server:
        type: responses_api_agents
        name: or_val_wg_test_vanilla
      resources_tool_transports:
      - direct_http
jailbreak_val_wg_test_vanilla_environment_server:
  environment_servers:
    single_agent_turn_legacy:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: jailbreak_detection
      agent_server:
        type: responses_api_agents
        name: jailbreak_val_wg_test_vanilla
      resources_tool_transports:
      - direct_http
