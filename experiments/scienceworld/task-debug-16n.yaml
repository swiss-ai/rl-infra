# Pipeline debug on 16 nodes (8 trainer + 8 vLLM): the run-3 mix plus ScienceWorld, 32 prompts from each of the four
# sources per step (128), 3 steps, one small validation at step 2 (ScienceWorld dev set, then GPQA rows, 200 in all) to
# check the mixed-environment metrics. Everything else as experts/stem/archive/stem-mix-run3-sciworld.yaml.

grpo:
  max_num_steps: 3
  max_num_epochs: 1
  val_at_start: false
  val_period: 2
  val_at_end: false
  val_batch_size: 200
  max_val_samples: 200
  # ScienceWorld turns per episode; math environments end after the first turn.
  max_rollout_turns: 52

data:
  _override_: true
  max_input_seq_length: 2048
  shuffle: true
  num_workers: 1
  use_multiple_dataloader: true
  custom_dataloader: examples.custom_dataloader.custom_dataloader.example_custom_dataloader
  num_prompts_per_dataloader:
    DAPOMath17K: 32
    run3-numina_clean: 32
    run3-mcqa_science_cs: 32
    scienceworld-sciworld_tool_train: 32
  train:
    - dataset_name: DAPOMath17K
      deduplicate: true
    - dataset_name: ResponseDataset
      data_path: /scratch/hanint06/data/stem-rl/run3/numina_clean.jsonl
    - dataset_name: ResponseDataset
      data_path: /scratch/hanint06/data/stem-rl/run3/mcqa_science_cs.jsonl
      env_name: math_default
    - dataset_name: ResponseDataset
      data_path: /scratch/hanint06/data/stem-rl/scienceworld/sciworld_tool_train.jsonl
      processor: apertus2_sciworld_data_processor
      system_prompt_file: ${oc.env:RL_INFRA_DIR}/shared/frames/apertus2-system-sciworld-act.json
      env_name: scienceworld
  validation:
    - dataset_name: ResponseDataset
      data_path: /scratch/hanint06/data/stem-rl/scienceworld/sciworld_tool_dev.jsonl
      processor: apertus2_sciworld_data_processor
      system_prompt_file: ${oc.env:RL_INFRA_DIR}/shared/frames/apertus2-system-sciworld-act.json
      env_name: scienceworld
    - dataset_name: ResponseDataset
      data_path: /scratch/hanint06/data/stem-rl/gpqa_diamond_x8.jsonl
      env_name: math_default
  default:
    prompt_file: null
    system_prompt_file: ${oc.env:RL_INFRA_DIR}/shared/frames/apertus2-system.json
    processor: apertus2_math_data_processor
    env_name: math

env:
  # Multiple-choice questions: the same environment class, grading the option letter in the claim.
  math_default:
    num_workers: 8
    verifier_type: claim_multichoice
    reward_frame: claim
  scienceworld:
    # Simulator workers (one JVM each, ~15 MB per live episode), two per vLLM node.
    num_workers: 16
    placement_group_prefix: grpo_inference_cluster
    java_path: /home01/hanint06/sciworld/jre/bin/java
    package_path: /home01/hanint06/sciworld/pydeps
    jvm_heap: 3g
    tokenizer_path: ${policy.model_name}
    simplifications: teleportAction,openDoors,openContainers,selfWateringFlowerPots
    # Simulator commands per episode.
    max_actions: 50
    max_calls_per_turn: 1
    idle_timeout_s: 1800
    call_timeout_s: 300
    max_observation_chars: null
