# Debug tool, not a training task: the trainer's teacher-forced log-probabilities of plain text.
# Each row of the file ({"input": <text>, "output": "0"}) is one prompt; the model adds 4 tokens,
# and one GRPO step writes train_data_step1.jsonl, whose prev_logprobs hold the trainer's
# log-probability of every prompt token. Rewards are all 0, so the step changes no weights.
#   RECIPE=recipes/<model recipe>.yaml bash run.sh shared/debug/score-text.yaml data.train.data_path=<file.jsonl>
grpo:
  num_prompts_per_step: 300
  num_generations_per_prompt: 2
  max_num_steps: 1
  val_period: 0
  val_at_start: false
  val_at_end: false

checkpointing:
  enabled: false

policy:
  max_total_sequence_length: 4096
  train_global_batch_size: 600
  generation:
    max_new_tokens: 4

data:
  max_input_seq_length: 4000
  train:
    dataset_name: ResponseDataset
    data_path: null
    env_name: math
  default:
    prompt_file: null
    processor: math_hf_data_processor
    env_name: math

env:
  math:
    num_workers: 8
    math_verify_impl: hf_math_verify
