# The LLM judge grader, shared by the experts that grade open answers (STEM openqa; templates of safety, knowledge,
# translation): the llm_judge environment (NeMo-RL patches 0053-0056; handover/openqa-judge-integration.md). It asks
# a judge server (env.extra_judge_pools.<model>, named judge_<model>) whether an answer agrees with the reference and turns the reply into a reward.
# Which judge model serves it, and on how many nodes, is the expert's choice: its base.yaml takes this file, a server
# file from shared/judges/servers/, gives that server its nodes and points env.llm_judge.judge_pool at it:
#   defaults:
#     - ../../shared/judges/llm-judge.yaml
#     - ../../shared/judges/servers/gemma-4-26B-A4B-it.yaml
#   env:
#     extra_judge_pools: {gemma-4-26B-A4B-it: {num_nodes: 1}}
#     llm_judge: {judge_pool: judge_gemma-4-26B-A4B-it}
# and points a dataset at it with `env_name: llm_judge`. temperature and top_p must equal the server's
# (generation.temperature/top_p); NeMo-RL's server rejects other sampling settings.
env:
  llm_judge:
    # The server it asks: judge_<model> for env.extra_judge_pools.<model> (set by the expert, with the server file).
    judge_pool: ???
    mode: verdict
    score: hard
    min_verdict_mass: 0.0
    # vLLM structured outputs: the judge can only answer Yes or No.
    structured: true
    max_reasoning_chars: 400
    # A failed judge call makes its sample zero-weight instead of reward 0; nothing to judge stays reward 0.
    mask_failures: true
    reward_frame: claim
    fallback_frame: reply
    temperature: 1.0
    top_p: 1.0
    max_tokens: 512
    top_logprobs: 20
    max_concurrent_calls: 1024
    timeout_s: 300
    retries: 2
    pool_wait_s: 3600
    max_answer_chars: 2000
    log_every: 512
    chat_template_kwargs:
      enable_thinking: false
