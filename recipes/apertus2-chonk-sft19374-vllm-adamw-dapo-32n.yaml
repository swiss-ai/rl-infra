# The SFT 19374 DAPO recipe on twice the nodes: 16 trainer nodes (PP2, EP16, data-parallel 32)
# and 16 vLLM nodes. Same algorithm and batch as the 16-node recipe; only throughput changes.
defaults: apertus2-chonk-sft19374-vllm-adamw-dapo.yaml

cluster:
  num_nodes: 32

policy:
  generation:
    colocated:
      resources:
        num_nodes: 16
