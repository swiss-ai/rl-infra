# The DAPO-Math recipe on the SFT v0.2 checkpoint (iteration 18,315) on 32 nodes: 16 trainer nodes (PP2, EP16,
# data-parallel 32) and 16 vLLM nodes. Same model as rl-step-scaling/recipes/apertus2-chonk-sftv02-18315-vllm-adamw-dapo.yaml,
# same node split as apertus2-chonk-sft19374-vllm-adamw-dapo-32n.yaml.
defaults: apertus2-chonk-sft-vllm-adamw-dapo.yaml

# run.sh reads sft_export and cluster.num_nodes from this file only, not from its defaults.
sft_export: chonk-sft/models/chonk-lc-16k-v0.2-iter_0018315

cluster:
  num_nodes: 32

policy:
  model_name: ${oc.env:SCRATCH}/models/chonk-lc-16k-v0.2-iter_0018315
  generation:
    colocated:
      resources:
        num_nodes: 16
