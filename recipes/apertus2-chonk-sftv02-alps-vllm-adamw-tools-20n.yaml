# apertus2-chonk-sft19374-alps-vllm-adamw-tools-20n.yaml (20 nodes: 16 trainer PP2 EP32 + 4 vLLM TP1 EP4 FP8) on the
# SFT v0.2 checkpoint, iteration 18,315, the checkpoint of main's long-context runs (experiments/long-context/recipes/
# code-sftv02-*.yaml) and of Kostas' and Davit's current recipes. The export on /capstor is the one of
# origin/lean-kimina-verifier's recipes/apertus2-chonk-sftv02-18315-vllm-adamw-code.yaml. Daint 2026-11-20: 51 shards,
# 202G, config.json identical to v0.1's, no MODELING_SOURCE, so run.sh copies its small files, links the shards and adds
# the hfconverter modeling code (as for v0.1). Used by experiments/chonk-sc/run-v-24k.sh and run-agent-v.sh at
# CTX > 24576 (context parallelism comes from the launchers' overrides, not from here). The first run converts the
# checkpoint to Megatron (a new conversion directory).
defaults: apertus2-chonk-sft19374-alps-vllm-adamw-tools-20n.yaml

# run.sh reads these two and cluster.num_nodes from this file itself (yq), not through the defaults
sft_export: /capstor/store/cscs/swissai/infra01/apertus_checkpoints/v2/hf/chonk/posttraining/chonk-lc-16k-v0.2-iter_0018315
sft_stage_as: chonk-lc-16k-v0.2-iter_0018315

cluster:
  num_nodes: 20

policy:
  model_name: ${oc.env:SCRATCH}/models/chonk-lc-16k-v0.2-iter_0018315
