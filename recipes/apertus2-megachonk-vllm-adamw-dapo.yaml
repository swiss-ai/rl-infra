# MegaChonk on DAPO-Math with AIME 2024 validation at 16K, the counterpart of
# apertus2-chonk-vllm-adamw-dapo.yaml: 32 trainer nodes and 16 vLLM nodes (two 8-node replicas).
# No checkpoints (one with optimizer state is several TB); the timer below still ends the run
# 30 minutes before a 2-day job limit.
defaults: ../experiments/grpo-chonk/megachonk-dapo-16k-megatron-128x16-async-fp8-skip-trunc0.yaml

cluster:
  num_nodes: 48

checkpointing:
  enabled: false
  checkpoint_must_save_by: "01:23:30:00"

policy:
  generation:
    colocated:
      resources:
        num_nodes: 16
