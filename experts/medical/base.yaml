# Medical expert: every dataset, environment and validation set, defined once. TEMPLATE: the datasets below are
# placeholders. Fill in the TODOs, then delete `template: true` (run.sh refuses to submit a template; DRY_RUN=1
# shows it). Layout as experts/stem/base.yaml; this file is the official run (bash run.sh medical).
# Starting point: medical multiple choice (e.g. MedQA, MedMCQA) graded on the option letter in the claim frame. For
# open answers graded by a judge, add `defaults: ../../shared/judges/llm-judge.yaml` and a dataset with env_name llm_judge.
template: true
recipe: recipes/apertus2-chonk-sftv02-grpo.yaml

# Thinking level per dataset (the system frame its prompts start with); a run file overrides one key.
frames:
  default: ${oc.env:RL_INFRA_DIR}/shared/frames/apertus2-system-high.json

grpo:
  max_num_epochs: 1
  max_num_steps: 100            # TODO: steps of the official run
  val_batch_size: 1000           # TODO: number of validation prompts
  max_val_samples: 1000

data:
  _override_: true
  max_input_seq_length: 4096
  shuffle: true
  num_workers: 1
  use_multiple_dataloader: true
  custom_dataloader: examples.custom_dataloader.custom_dataloader.example_custom_dataloader
  # Prompts per step from each training set, named <folder>-<file> of its data_path; they add up to
  # grpo.num_prompts_per_step (512 in the recipe).
  num_prompts_per_dataloader:
    medical-train: 512           # TODO: one entry per training set
  train:
    # TODO: rows {"input": <question with options>, "output": <option letter>} under ${RL_DATA_DIR}/medical/
    - dataset_name: ResponseDataset
      data_path: ${oc.env:RL_DATA_DIR}/medical/train.jsonl
      env_name: math_default
  validation:
    - dataset_name: ResponseDataset
      data_path: ${oc.env:RL_DATA_DIR}/medical/validation.jsonl
      env_name: math_default
  default:
    prompt_file: null
    system_prompt_file: ${frames.default}
    processor: apertus2_math_data_processor
    env_name: math

env:
  # Multiple choice: NeMo-RL's math environment grading the option letter in the claim (as STEM's math_default).
  # Environment names must be registered in NeMo-RL (nemo_rl/environments/utils.py): math and math_default are two
  # configurations of the math environment, llm_judge the judge.
  math_default:
    num_workers: 8
    verifier_type: claim_multichoice
    reward_frame: claim
