# Competitive coding (rl-infra-main recipes/archive/apertus2-chonk-sft-vllm-adamw-code.yaml) on the SFT v0.2 checkpoint
# (iteration 18,315): 12 nodes = 8 trainer + 4 vLLM. For debug runs when fewer than 16 nodes are free; the trainer
# needs 8 nodes (PP2 x EP16), so only the vLLM side is smaller.
defaults: ../../../../../recipes/archive/apertus2-chonk-sft-vllm-adamw-code.yaml

# run.sh reads sft_export and cluster.num_nodes from this file only, not from its defaults.
sft_export: chonk-sft/models/chonk-lc-16k-v0.2-iter_0018315

cluster:
  num_nodes: 12

policy:
  model_name: ${oc.env:SCRATCH}/models/chonk-lc-16k-v0.2-iter_0018315
  generation:
    colocated:
      resources:
        num_nodes: 4
