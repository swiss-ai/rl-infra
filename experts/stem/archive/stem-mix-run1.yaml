# STEM mix, run 1: more math. 270 steps of 128 prompts: 64 from DAPO-Math-17K (all of it) and 64
# from NuminaMath-1.5 competition problems (17,280; filtered, deduplicated against DAPO and
# decontaminated against AIME 2024-2026 and HMMT Feb 2025-2026). Validation every 20 steps:
# AIME 2024 mean@32 (as in the DAPO runs) and GPQA-Diamond mean@8.
# Data files: /scratch/hanint06/data/stem-rl, built by the STEM data script (see runs.md).
defaults: ../../../recipes/apertus2-chonk-sft19374-vllm-adamw-dapo-32n.yaml

grpo:
  max_num_steps: 270
  max_num_epochs: 1
  val_period: 20
  val_batch_size: 2544
  max_val_samples: 2544

data:
  _override_: true
  max_input_seq_length: 2048
  shuffle: true
  num_workers: 1
  use_multiple_dataloader: true
  custom_dataloader: examples.custom_dataloader.custom_dataloader.example_custom_dataloader
  num_prompts_per_dataloader:
    DAPOMath17K: 64
    stem-rl-numina_run1: 64
  train:
    - dataset_name: DAPOMath17K
      deduplicate: true
    - dataset_name: ResponseDataset
      data_path: /scratch/hanint06/data/stem-rl/numina_run1.jsonl
  validation:
    - dataset_name: DAPOMathAIME2024
      split: test
    - dataset_name: ResponseDataset
      data_path: /scratch/hanint06/data/stem-rl/gpqa_diamond_x8.jsonl
      env_name: math_default
  default:
    prompt_file: null
    system_prompt_file: ${oc.env:RL_INFRA_DIR}/shared/frames/apertus2-system.json
    processor: apertus2_math_data_processor
    env_name: math

env:
  # Multiple-choice questions: the same environment class, grading the option letter in the claim.
  math_default:
    num_workers: 8
    verifier_type: claim_multichoice
    reward_frame: claim
