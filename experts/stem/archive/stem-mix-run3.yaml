# STEM mix, run 3: math and science on SFT v0.2, 512 prompts per step. 100 steps (51,200 prompts):
# 128 from DAPO-Math-17K, 256 from the cleaned NuminaMath-1.5 pool (all answer types) and 128 from the
# science + computer-science part of Nemotron-RL-knowledge-mcqa (domain-labelled; medicine and law excluded).
# Validation every 20 steps: AIME 2024 mean@32 and GPQA-Diamond mean@8 (as run 2).
# Data files: /scratch/hanint06/data/stem-rl/run3 (built by scripts/build_run3.py; see handover/numinamath-filtering.md).
defaults: ../../../recipes/apertus2-chonk-sftv02-18315-vllm-adamw-dapo-32n.yaml

grpo:
  max_num_steps: 100
  max_num_epochs: 1
  val_period: 20
  val_batch_size: 2544
  max_val_samples: 2544

data:
  _override_: true
  max_input_seq_length: 2048
  shuffle: true
  num_workers: 1
  use_multiple_dataloader: true
  custom_dataloader: examples.custom_dataloader.custom_dataloader.example_custom_dataloader
  num_prompts_per_dataloader:
    DAPOMath17K: 128
    run3-numina_clean: 256
    run3-mcqa_science_cs: 128
  train:
    - dataset_name: DAPOMath17K
      deduplicate: true
    - dataset_name: ResponseDataset
      data_path: /scratch/hanint06/data/stem-rl/run3/numina_clean.jsonl
    - dataset_name: ResponseDataset
      data_path: /scratch/hanint06/data/stem-rl/run3/mcqa_science_cs.jsonl
      env_name: math_default
  validation:
    - dataset_name: DAPOMathAIME2024
      split: test
    - dataset_name: ResponseDataset
      data_path: /scratch/hanint06/data/stem-rl/gpqa_diamond_x8.jsonl
      env_name: math_default
  default:
    prompt_file: null
    system_prompt_file: ${oc.env:RL_INFRA_DIR}/shared/frames/apertus2-system.json
    processor: apertus2_math_data_processor
    env_name: math

env:
  # Multiple-choice questions: the same environment class, grading the option letter in the claim.
  math_default:
    num_workers: 8
    verifier_type: claim_multichoice
    reward_frame: claim
