# Run 5 at 32K as job 1299180 ran it (2026-11-18, sftv02-stem-mix-run5-32k-49n), in the expert layout: base.yaml with
# thinking medium except Reasoning Gym and chemistry (high), the setting of that time (at medium the model left the
# think frame empty on those two). Everything else of that run is base.yaml with experts/main.yaml: same mix, steps,
# checkpoints, dump, 32K, 16 trainer + 32 vLLM + 1 judge nodes. NeMo-RL patches newer than that run (0042, 0045-0051)
# are part of the code now. The task file the run itself read is stem-mix-run5.yaml next to this one.
#   RUN=sftv02-stem-mix-run5-32k-49n bash run.sh experts/stem/archive/run5-32k-job1299180.yaml
defaults: ../base.yaml
# The recipe that run used (the 14-file chain), not the flat recipe written out from it later.
recipe: recipes/archive/apertus2-chonk-sftv02-grpo.yaml
# What that run had from experts/main.yaml, pinned here so that a later change to main.yaml does not change this
# record: resources, validation period, checkpoints, rollout dump.
size: expensive
job_time: 2-00:00:00
context: 32768

grpo:
  val_period: 20

checkpointing:
  enabled: true
  save_period: 20
  keep_top_k: 10
  metric_name: null
  save_optimizer: false

env:
  should_log_nemo_gym_responses: false
  train_dump_text_only: true

frames:
  default: ${oc.env:RL_INFRA_DIR}/shared/frames/apertus2-system.json
  reasoning_gym: ${oc.env:RL_INFRA_DIR}/shared/frames/apertus2-system-high.json
  chemistry: ${oc.env:RL_INFRA_DIR}/shared/frames/apertus2-system-high.json
  scienceworld: ${oc.env:RL_INFRA_DIR}/shared/frames/apertus2-system-sciworld-act.json
