# Pipeline debug of the Enigmata integration: the run-3 mix (experts/stem/archive/stem-mix-run3.yaml) with 64 of each 512-prompt
# step from Enigmata puzzles of all 81 generated cells (provisional uniform file, select-uniform.json), graded by
# the native enigmata environment. Per step: 128 DAPO-Math-17K, 192 cleaned NuminaMath-1.5, 128 science + CS
# knowledge-mcqa, 64 Enigmata. Launch: STEPS=4 VAL=0 TASK=experts/stem/scripts/enigmata/task-debug-uniform.yaml launch.sh.
defaults: ../../../../recipes/archive/apertus2-chonk-sftv02-18315-vllm-adamw-dapo-32n.yaml

grpo:
  max_num_steps: 100
  max_num_epochs: 1
  val_period: 20
  val_batch_size: 2544
  max_val_samples: 2544

data:
  _override_: true
  max_input_seq_length: 2048
  shuffle: true
  num_workers: 1
  use_multiple_dataloader: true
  custom_dataloader: examples.custom_dataloader.custom_dataloader.example_custom_dataloader
  num_prompts_per_dataloader:
    DAPOMath17K: 128
    run3-numina_clean: 192
    run3-mcqa_science_cs: 128
    train-enigmata_uniform: 64
  train:
    - dataset_name: DAPOMath17K
      deduplicate: true
    - dataset_name: ResponseDataset
      data_path: /scratch/hanint06/data/stem-rl/run3/numina_clean.jsonl
    - dataset_name: ResponseDataset
      data_path: /scratch/hanint06/data/stem-rl/run3/mcqa_science_cs.jsonl
      env_name: math_default
    - dataset_name: ResponseDataset
      data_path: /scratch/hanint06/data/stem-rl/enigmata/train/enigmata_uniform.jsonl
      env_name: enigmata
  validation:
    - dataset_name: DAPOMathAIME2024
      split: test
    - dataset_name: ResponseDataset
      data_path: /scratch/hanint06/data/stem-rl/gpqa_diamond_x8.jsonl
      env_name: math_default
  default:
    prompt_file: null
    system_prompt_file: ${oc.env:RL_INFRA_DIR}/shared/frames/apertus2-system.json
    processor: apertus2_math_data_processor
    env_name: math

env:
  # Multiple-choice questions: the same environment class, grading the option letter in the claim.
  math_default:
    num_workers: 8
    verifier_type: claim_multichoice
    reward_frame: claim
  # Enigmata puzzles: each task's own verifier (Enigmata checkout b9c6f59) on the claim frame, on the reply
  # when the claim is empty. Exceptions and timeouts score 0 and are counted.
  enigmata:
    repo_dir: /scratch/hanint06/data/stem-rl/enigmata/repo
    num_workers: 16
    reward_frame: claim
    fallback_frame: reply
    timeout_s: 10.0
    hard_timeout_s: 120.0
    log_every: 1024
    stats_path: ${logger.log_dir}/enigmata_stats.jsonl
    stats_text_chars: 300
