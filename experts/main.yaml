# The run: what every expert's run shares, and the resources it gets. run.sh puts this file between the recipe and
# the expert's files:
#   bash run.sh <expert>                      recipe, then this file, then experts/<expert>/base.yaml
#   bash run.sh experts/<expert>/dev/x.yaml   recipe, then this file, then base.yaml and the dev file
# An expert's base.yaml defines what to train on (datasets, environments, validation, steps); a dev file may also
# change anything here for one variant. Task files in the older layout (archive/ files that name their recipe in
# `defaults`) do not take this file and run as they ran.

# Resources (rl-infra keys, read by run.sh): the node tier in sizes/, the Slurm time limit (checkpoints are saved
# and the run stops 30 minutes before it) and the longest prompt + answer, which selects CP, packing and the memory
# fraction from backends/nemo-rl/apertus2/contexts.tsv. Also replaceable per launch: SIZE=, JOB_TIME=.
size: expensive
job_time: 2-00:00:00
context: 32768

grpo:
  val_period: 20

checkpointing:
  # Weights only (no optimizer state), every 20 steps, the last 10 kept (about 200 GB each for Chonk, so about
  # 2 TB per run on the group's 80 TB scratch).
  enabled: true
  save_period: 20
  keep_top_k: 10
  metric_name: null
  save_optimizer: false

env:
  # Every step's rollouts as text (prompt, answer, reward, length) without the per-token arrays (NeMo-RL patch
  # 0043): train_data_step<N>.jsonl in the log directory, about 200 MB per step at 32K.
  should_log_nemo_gym_responses: false
  train_dump_text_only: true
