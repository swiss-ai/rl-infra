# General chat, helpfulness and instruction following expert, its official run. TEMPLATE: this expert's runs so
# far are task files in archive/ (older layout: recipe in `defaults`, launch settings on the command line). Until
# this file is written, it takes ultrafeedback-rubric-sft.yaml (UltraFeedback prompts rewarded by an LLM judge on
# rubrics, AlpacaEval validation, SFT checkpoint) through `defaults`, so `DRY_RUN=1 bash run.sh chat` shows that
# run; run.sh refuses to submit it.  To make it the expert's base (as experts/stem/base.yaml): move the datasets,
# environments and validation of the run that becomes official here, name its recipe with `recipe:`, set `context:`,
# `size:`, `job_time:` and its steps, drop the defaults line, then delete `template: true`. Variants go to dev/,
# finished runs to archive/, data builders to scripts/.
template: true
defaults: archive/ultrafeedback-rubric-sft.yaml
