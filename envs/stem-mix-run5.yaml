# STEM mix, run 5: SFT v0.2 on the run-3 data plus four generated environments, 512 prompts per step, 100 steps.
# Per step: 96 DAPO-Math-17K, 192 cleaned NuminaMath-1.5, 96 science + CS knowledge-mcqa (run 3's 1:2:1), and
# 32 each (6.25%) from Reasoning Gym, Enigmata, ScienceWorld and RDKit chemistry. No openqa and no judge node
# (run 4 had both), hence 32 nodes = 16 trainer + 16 vLLM.
# Thinking medium (apertus2-system.json) everywhere except Reasoning Gym and chemistry, which use thinking high: at
# medium the model leaves the think frame empty on those prompts (runs.md: PR swiss-ai/rl-infra#5 and the RDKit
# chemistry section).
# Chemistry: rows from envs/gen_chem_rdkit.py, a template counterpart of the generator in PR swiss-ai/rl-infra#6
# (whose rows this account cannot read): NCI Open Database molecules (public domain), 33 integer-valued properties
# computed with RDKit, each defined in the question. Graded by the math environment on the claim; every prompt
# carries DAPO-Math's answer-line instruction.
# Validation every 20 steps: AIME 2024 mean@32 and GPQA-Diamond mean@8 as in runs 3 and 4, plus 264 held-out
# chemistry prompts (8 per property; molecules share no Bemis-Murcko scaffold with train).
# Sources: envs/stem-mix-run4.yaml, envs/chem-rdkit-sft.yaml.
defaults: ../recipes/apertus2-chonk-sftv02-18315-vllm-adamw-dapo-32n.yaml

# Reasoning Gym's scorers in the pydeps overlay (run.sh).
pydeps: reasoning_gym

grpo:
  max_num_steps: 100
  max_num_epochs: 1
  val_period: 20
  # 960 AIME + 1,584 GPQA-Diamond + 264 chemistry.
  val_batch_size: 2808
  max_val_samples: 2808
  # ScienceWorld turns (at most 50 actions per episode); the single-turn environments end after one.
  max_rollout_turns: 60

data:
  _override_: true
  # Reasoning Gym prompts reach 3.6k tokens; chemistry prompts at most 1,897 characters.
  max_input_seq_length: 4096
  shuffle: true
  num_workers: 1
  use_multiple_dataloader: true
  custom_dataloader: examples.custom_dataloader.custom_dataloader.example_custom_dataloader
  num_prompts_per_dataloader:
    DAPOMath17K: 96
    run3-numina_clean: 192
    run3-mcqa_science_cs: 96
    reasoning_gym-train: 32
    train-enigmata_v1: 32
    scienceworld-sciworld_act_train: 32
    chem_rdkit-train: 32
  train:
    - dataset_name: DAPOMath17K
      deduplicate: true
    - dataset_name: ResponseDataset
      data_path: /scratch/hanint06/data/stem-rl/run3/numina_clean.jsonl
    - dataset_name: ResponseDataset
      data_path: /scratch/hanint06/data/stem-rl/run3/mcqa_science_cs.jsonl
      env_name: math_default
    - dataset_name: ResponseDataset
      data_path: /scratch/hanint06/data/stem-rl/reasoning_gym/train.jsonl
      env_name: reasoning_gym
      system_prompt_file: ${oc.env:RL_INFRA_DIR}/envs/apertus2-system-high.json
    - dataset_name: ResponseDataset
      data_path: /scratch/hanint06/data/stem-rl/enigmata/train/enigmata_v1.jsonl
      env_name: enigmata
    # ScienceWorld episodes (handover/scienceworld-integration.md): the model acts through an `act` tool declared in
    # this system frame (thinking medium); the simulator's observation returns as the next input frame.
    - dataset_name: ResponseDataset
      data_path: /scratch/hanint06/data/stem-rl/scienceworld/sciworld_act_train.jsonl
      processor: apertus2_sciworld_data_processor
      system_prompt_file: /scratch/hanint06/data/stem-rl/scienceworld/apertus2-system-sciworld-act.json
      env_name: scienceworld
    # RDKit chemistry (envs/gen_chem_rdkit.py): integer answers, the math environment on the claim.
    - dataset_name: ResponseDataset
      data_path: /scratch/hanint06/data/stem-rl/chem_rdkit/train.jsonl
      system_prompt_file: ${oc.env:RL_INFRA_DIR}/envs/apertus2-system-high.json
  validation:
    - dataset_name: DAPOMathAIME2024
      split: test
    - dataset_name: ResponseDataset
      data_path: /scratch/hanint06/data/stem-rl/gpqa_diamond_x8.jsonl
      env_name: math_default
    - dataset_name: ResponseDataset
      data_path: /scratch/hanint06/data/stem-rl/chem_rdkit/validation.jsonl
      system_prompt_file: ${oc.env:RL_INFRA_DIR}/envs/apertus2-system-high.json
  default:
    prompt_file: null
    system_prompt_file: ${oc.env:RL_INFRA_DIR}/envs/apertus2-system.json
    processor: apertus2_math_data_processor
    env_name: math

env:
  # Multiple-choice questions: the same environment class, grading the option letter in the claim.
  math_default:
    num_workers: 8
    verifier_type: claim_multichoice
    reward_frame: claim
  # Reasoning Gym: the math environment with each task's scorer (NeMo-RL reasoning_gym_verifier.py), on the claim.
  reasoning_gym:
    num_workers: 8
    verifier_type: reasoning_gym
    reward_frame: claim
  # Enigmata puzzles (generated with the Apache-2.0 generators; handover/enigmata-integration.md): each task's own
  # verifier on the claim frame, on the reply when the claim is empty. Exceptions and timeouts score 0 and are counted.
  enigmata:
    repo_dir: /scratch/hanint06/data/stem-rl/enigmata/repo
    num_workers: 16
    reward_frame: claim
    fallback_frame: reply
    timeout_s: 10.0
    hard_timeout_s: 120.0
    log_every: 1024
    stats_path: ${logger.log_dir}/enigmata_stats.jsonl
    stats_text_chars: 0
  # ScienceWorld: one JVM per worker (about 1.3 GB, heap 3 GB), started from the JRE and package in home. Reward is
  # the episode's last score / 100, clipped to [0, 1]; an episode the simulator loses is masked from the loss.
  scienceworld:
    num_workers: 32
    placement_group_prefix: grpo_inference_cluster
    java_path: /home01/hanint06/sciworld/jre/bin/java
    package_path: /home01/hanint06/sciworld/pydeps
    jvm_heap: 3g
    tokenizer_path: ${policy.model_name}
    simplifications: teleportAction,openDoors,openContainers,selfWateringFlowerPots
    max_actions: 50
    max_calls_per_turn: 1
    idle_timeout_s: 1800
    call_timeout_s: 300
    max_observation_chars: null
