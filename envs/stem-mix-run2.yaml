# STEM mix, run 2: math and science. 270 steps of 128 prompts: 64 from DAPO-Math-17K (all of it),
# 40 from NuminaMath-1.5 competition problems (the first 10,800 of run 1's) and 24 from
# Nemotron-RL-knowledge-mcqa (6,480 multiple-choice questions, decontaminated against GPQA-Diamond).
# Validation every 20 steps: AIME 2024 mean@32 and GPQA-Diamond mean@8.
# Data files: /scratch/hanint06/data/stem-rl, built by the STEM data script (see runs.md).
defaults: ../recipes/apertus2-chonk-sft19374-vllm-adamw-dapo-32n.yaml

grpo:
  max_num_steps: 270
  max_num_epochs: 1
  val_period: 20
  val_batch_size: 2544
  max_val_samples: 2544

data:
  _override_: true
  max_input_seq_length: 2048
  shuffle: true
  num_workers: 1
  use_multiple_dataloader: true
  custom_dataloader: examples.custom_dataloader.custom_dataloader.example_custom_dataloader
  num_prompts_per_dataloader:
    DAPOMath17K: 64
    stem-rl-numina_run2: 40
    stem-rl-mcqa_run2: 24
  train:
    - dataset_name: DAPOMath17K
      deduplicate: true
    - dataset_name: ResponseDataset
      data_path: /scratch/hanint06/data/stem-rl/numina_run2.jsonl
    - dataset_name: ResponseDataset
      data_path: /scratch/hanint06/data/stem-rl/mcqa_run2.jsonl
      env_name: math_default
  validation:
    - dataset_name: DAPOMathAIME2024
      split: test
    - dataset_name: ResponseDataset
      data_path: /scratch/hanint06/data/stem-rl/gpqa_diamond_x8.jsonl
      env_name: math_default
  default:
    prompt_file: null
    system_prompt_file: ${oc.env:RL_INFRA_DIR}/envs/apertus2-system.json
    processor: apertus2_math_data_processor
    env_name: math

env:
  # Multiple-choice questions: the same environment class, grading the option letter in the claim.
  math_default:
    num_workers: 8
    verifier_type: claim_multichoice
    reward_frame: claim
