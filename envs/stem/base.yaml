# STEM expert: every dataset, environment and validation set, defined once. Run files (main.yaml, dev/*.yaml) take
# this as `defaults` and change what they need: the shares of a step (data.num_prompts_per_dataloader), the thinking
# level of each dataset (frames), steps, checkpoints, context and node tier.
#
# Training data (8 datasets, ${oc.env:RL_DATA_DIR}/stem-rl, prepared by envs/stem/prepare_*.py and the handovers):
#   DAPOMath17K                      DAPO-Math-17K, deduplicated              math environment, claim frame
#   run3-numina_clean                cleaned NuminaMath-1.5                   math environment, claim frame
#   run3-mcqa_science_cs             science + CS multiple choice             math_default (option letter in claim)
#   openqa-openqa_science            open science answers                     llm_judge (gemma-4-26B-A4B verdict)
#   reasoning_gym-train              Reasoning Gym tasks                      reasoning_gym verifier
#   train-enigmata_v1                Enigmata puzzles (Apache-2.0 generators)  enigmata verifiers
#   scienceworld-sciworld_act_train  ScienceWorld episodes, act tool          scienceworld (multi-turn, JVM)
#   chem_faithful-train              RDKit chemistry (molecules from COCONUT and NCI DTP)  math environment
# Validation (2,790 prompts): AIME 2024 x32, GPQA-Diamond x8, 246 held-out chemistry prompts (2 per RDKit property;
# no Bemis-Murcko scaffold shared with train).
# Each user needs: the judge model in ${SCRATCH}/models (envs/tools/stage_judge_model.sh) and ScienceWorld's JRE and
# package in ~/sciworld (handover/scienceworld-integration.md).
recipe: recipes/apertus2-chonk-sftv02-grpo.yaml
# Reasoning Gym's scorers in the pydeps overlay (run.sh).
pydeps: reasoning_gym
context: 32768

# Thinking level per dataset: the system frame its prompts start with. The data entries below refer to these keys,
# so a run file changes a level by overriding one key here. ScienceWorld's frame also declares the act tool.
frames:
  default: ${oc.env:RL_INFRA_DIR}/envs/frames/apertus2-system-high.json
  reasoning_gym: ${frames.default}
  chemistry: ${frames.default}
  scienceworld: ${oc.env:RL_INFRA_DIR}/envs/frames/apertus2-system-sciworld-act-high.json

grpo:
  max_num_epochs: 1
  val_period: 20
  # 960 AIME + 1,584 GPQA-Diamond + 246 chemistry.
  val_batch_size: 2790
  max_val_samples: 2790
  # ScienceWorld turns (at most 50 actions per episode); the single-turn environments end after one.
  max_rollout_turns: 60

data:
  _override_: true
  # Reasoning Gym prompts reach 3.6k tokens; chemistry prompts at most 1,897 characters.
  max_input_seq_length: 4096
  shuffle: true
  num_workers: 1
  use_multiple_dataloader: true
  custom_dataloader: examples.custom_dataloader.custom_dataloader.example_custom_dataloader
  # Prompts per step from each dataset (they must add up to grpo.num_prompts_per_step, 512 in the recipe); run
  # files override these. Every dataset needs an entry.
  num_prompts_per_dataloader:
    DAPOMath17K: 96
    run3-numina_clean: 96
    run3-mcqa_science_cs: 96
    openqa-openqa_science: 96
    reasoning_gym-train: 32
    train-enigmata_v1: 32
    scienceworld-sciworld_act_train: 32
    chem_faithful-train: 32
  train:
    - dataset_name: DAPOMath17K
      deduplicate: true
    - dataset_name: ResponseDataset
      data_path: ${oc.env:RL_DATA_DIR}/stem-rl/run3/numina_clean.jsonl
    - dataset_name: ResponseDataset
      data_path: ${oc.env:RL_DATA_DIR}/stem-rl/run3/mcqa_science_cs.jsonl
      env_name: math_default
    - dataset_name: ResponseDataset
      data_path: ${oc.env:RL_DATA_DIR}/stem-rl/openqa/openqa_science.jsonl
      env_name: llm_judge
    - dataset_name: ResponseDataset
      data_path: ${oc.env:RL_DATA_DIR}/stem-rl/reasoning_gym/train.jsonl
      env_name: reasoning_gym
      system_prompt_file: ${frames.reasoning_gym}
    - dataset_name: ResponseDataset
      data_path: ${oc.env:RL_DATA_DIR}/stem-rl/enigmata/train/enigmata_v1.jsonl
      env_name: enigmata
    # ScienceWorld episodes (handover/scienceworld-integration.md): the model acts through the `act` tool declared in
    # its frame; the simulator's observation returns as the next input frame.
    - dataset_name: ResponseDataset
      data_path: ${oc.env:RL_DATA_DIR}/stem-rl/scienceworld/sciworld_act_train.jsonl
      processor: apertus2_sciworld_data_processor
      system_prompt_file: ${frames.scienceworld}
      env_name: scienceworld
    # RDKit chemistry (envs/stem/dev/chem-rdkit-sft.yaml): integer or 0/1 answers, the math environment on the claim,
    # every prompt with DAPO-Math's answer-line instruction.
    - dataset_name: ResponseDataset
      data_path: ${oc.env:RL_DATA_DIR}/stem-rl/chem_faithful/train.jsonl
      system_prompt_file: ${frames.chemistry}
  validation:
    - dataset_name: DAPOMathAIME2024
      split: test
    - dataset_name: ResponseDataset
      data_path: ${oc.env:RL_DATA_DIR}/stem-rl/gpqa_diamond_x8.jsonl
      env_name: math_default
    - dataset_name: ResponseDataset
      data_path: ${oc.env:RL_DATA_DIR}/stem-rl/chem_faithful/validation.jsonl
      system_prompt_file: ${frames.chemistry}
  default:
    prompt_file: null
    system_prompt_file: ${frames.default}
    processor: apertus2_math_data_processor
    env_name: math

env:
  # Multiple-choice questions: the same environment class, grading the option letter in the claim.
  math_default:
    num_workers: 8
    verifier_type: claim_multichoice
    reward_frame: claim
  # Reasoning Gym: the math environment with each task's scorer (NeMo-RL patch 0034), on the claim.
  reasoning_gym:
    num_workers: 8
    verifier_type: reasoning_gym
    reward_frame: claim
  # Enigmata puzzles (handover/enigmata-integration.md): each task's own verifier on the claim frame, on the reply
  # when the claim is empty. Exceptions and timeouts score 0 and are counted.
  enigmata:
    repo_dir: ${oc.env:RL_DATA_DIR}/stem-rl/enigmata/repo
    num_workers: 16
    reward_frame: claim
    fallback_frame: reply
    timeout_s: 10.0
    hard_timeout_s: 120.0
    log_every: 1024
    stats_path: ${logger.log_dir}/enigmata_stats.jsonl
    stats_text_chars: 0
  # ScienceWorld: one JVM per worker (about 1.3 GB, heap 3 GB), started from the JRE and package in your home. Reward
  # is the episode's last score / 100, clipped to [0, 1]; an episode the simulator loses is masked from the loss.
  scienceworld:
    num_workers: 32
    placement_group_prefix: grpo_inference_cluster
    java_path: ${oc.env:RL_USER_HOME}/sciworld/jre/bin/java
    package_path: ${oc.env:RL_USER_HOME}/sciworld/pydeps
    jvm_heap: 3g
    tokenizer_path: ${policy.model_name}
    simplifications: teleportAction,openDoors,openContainers,selfWateringFlowerPots
    max_actions: 50
    max_calls_per_turn: 1
    idle_timeout_s: 1800
    call_timeout_s: 300
    max_observation_chars: null
  # Open answers: the llm_judge environment (handover/openqa-judge-integration.md).
  llm_judge:
    judge_pool: judge
    mode: verdict
    score: hard
    min_verdict_mass: 0.0
    # vLLM structured outputs: the judge can only answer Yes or No.
    structured: true
    max_reasoning_chars: 400
    # A failed judge call makes its sample zero-weight instead of reward 0; nothing to judge stays reward 0.
    mask_failures: true
    reward_frame: claim
    fallback_frame: reply
    temperature: 1.0
    top_p: 1.0
    max_tokens: 512
    top_logprobs: 20
    max_concurrent_calls: 1024
    timeout_s: 300
    retries: 2
    pool_wait_s: 3600
    max_answer_chars: 2000
    log_every: 512
    chat_template_kwargs:
      enable_thinking: false
  # The judge's own node (run.sh adds it to the tier's nodes).
  judge_pool:
    num_nodes: 1
    stats_path: ${logger.log_dir}/judge_stats.jsonl
    stats_interval_s: 5.0
    generation:
      backend: vllm
      model_name: ${oc.env:SCRATCH}/models/gemma-4-26B-A4B-it
      max_new_tokens: 1024
      temperature: 1.0
      top_p: 1.0
      top_k: null
      val_temperature: 0.0
      val_top_p: 1.0
      val_top_k: null
      stop_token_ids: null
      stop_strings: null
      colocated:
        enabled: false
      vllm_cfg:
        async_engine: true
        expose_http_server: true
        precision: bfloat16
        kv_cache_dtype: auto
        logprobs_mode: processed_logprobs
        tensor_parallel_size: 1
        pipeline_parallel_size: 1
        expert_parallel_size: 1
        gpu_memory_utilization: 0.88
        max_model_len: 8192
        enforce_eager: false
        use_deep_gemm: false
        num_last_layers_in_bf16: 0
        num_first_layers_in_bf16: 0
        enable_vllm_metrics_logger: true
        vllm_metrics_logger_interval: 2.0
        refit_with_reload_api: false
        enable_prefix_caching: true
      vllm_kwargs:
        max_num_seqs: 256
        max_num_batched_tokens: 16384
