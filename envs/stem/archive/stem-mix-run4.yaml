# STEM mix, run 4: SFT v0.2 on every integrated environment, 512 prompts per step, 100 steps.
# Per step: 88 DAPO-Math-17K, 176 cleaned NuminaMath-1.5, 88 science + CS knowledge-mcqa (run 3's 1:2:1),
# 64 science + CS knowledge-openqa graded by the llm_judge environment (gemma-4-26B-A4B verdict, 1 judge node),
# and about 6% each from Reasoning Gym (32), Enigmata (32) and ScienceWorld (32).
# Thinking medium (apertus2-system.json) everywhere except Reasoning Gym, which uses thinking high: at medium the
# SFT model leaves the think frame empty on those prompts (PR swiss-ai/rl-infra#5, runs.md).
# Validation every 20 steps: AIME 2024 mean@32 and GPQA-Diamond mean@8, as in run 3.
# Sources: envs/stem/archive/stem-mix-run3.yaml, envs/stem/archive/stem-mix-openqa-judge.yaml, envs/stem/dev/reasoning-gym-sft.yaml,
# experiments/enigmata/task-debug-uniform.yaml, experiments/scienceworld/.
defaults: ../../../recipes/apertus2-chonk-sftv02-18315-vllm-adamw-dapo-32n-judge1.yaml

# Reasoning Gym's scorers in the pydeps overlay (run.sh).
pydeps: reasoning_gym

grpo:
  max_num_steps: 100
  max_num_epochs: 1
  val_period: 20
  val_batch_size: 2544
  max_val_samples: 2544
  # ScienceWorld turns (at most 50 actions per episode); the single-turn environments end after one.
  max_rollout_turns: 60

data:
  _override_: true
  # Reasoning Gym prompts reach 3.6k tokens; the run-3 data stays far below.
  max_input_seq_length: 4096
  shuffle: true
  num_workers: 1
  use_multiple_dataloader: true
  custom_dataloader: examples.custom_dataloader.custom_dataloader.example_custom_dataloader
  num_prompts_per_dataloader:
    DAPOMath17K: 88
    run3-numina_clean: 176
    run3-mcqa_science_cs: 88
    openqa-openqa_science: 64
    reasoning_gym-train: 32
    train-enigmata_v1: 32
    scienceworld-sciworld_act_train: 32
  train:
    - dataset_name: DAPOMath17K
      deduplicate: true
    - dataset_name: ResponseDataset
      data_path: /scratch/hanint06/data/stem-rl/run3/numina_clean.jsonl
    - dataset_name: ResponseDataset
      data_path: /scratch/hanint06/data/stem-rl/run3/mcqa_science_cs.jsonl
      env_name: math_default
    - dataset_name: ResponseDataset
      data_path: /scratch/hanint06/data/stem-rl/openqa/openqa_science.jsonl
      env_name: llm_judge
    - dataset_name: ResponseDataset
      data_path: /scratch/hanint06/data/stem-rl/reasoning_gym/train.jsonl
      env_name: reasoning_gym
      system_prompt_file: ${oc.env:RL_INFRA_DIR}/envs/frames/apertus2-system-high.json
    - dataset_name: ResponseDataset
      data_path: /scratch/hanint06/data/stem-rl/enigmata/train/enigmata_v1.jsonl
      env_name: enigmata
    # ScienceWorld episodes (handover/scienceworld-integration.md): the model acts through an `act` tool declared in
    # this system frame (thinking medium); the simulator's observation returns as the next input frame.
    - dataset_name: ResponseDataset
      data_path: /scratch/hanint06/data/stem-rl/scienceworld/sciworld_act_train.jsonl
      processor: apertus2_sciworld_data_processor
      system_prompt_file: /scratch/hanint06/data/stem-rl/scienceworld/apertus2-system-sciworld-act.json
      env_name: scienceworld
  validation:
    - dataset_name: DAPOMathAIME2024
      split: test
    - dataset_name: ResponseDataset
      data_path: /scratch/hanint06/data/stem-rl/gpqa_diamond_x8.jsonl
      env_name: math_default
  default:
    prompt_file: null
    system_prompt_file: ${oc.env:RL_INFRA_DIR}/envs/frames/apertus2-system.json
    processor: apertus2_math_data_processor
    env_name: math

env:
  # Multiple-choice questions: the same environment class, grading the option letter in the claim.
  math_default:
    num_workers: 8
    verifier_type: claim_multichoice
    reward_frame: claim
  # Reasoning Gym: the math environment with each task's scorer (NeMo-RL reasoning_gym_verifier.py), on the claim.
  reasoning_gym:
    num_workers: 8
    verifier_type: reasoning_gym
    reward_frame: claim
  # Enigmata puzzles (generated with the Apache-2.0 generators; handover/enigmata-integration.md): each task's own
  # verifier on the claim frame, on the reply when the claim is empty. Exceptions and timeouts score 0 and are counted.
  enigmata:
    repo_dir: /scratch/hanint06/data/stem-rl/enigmata/repo
    num_workers: 16
    reward_frame: claim
    fallback_frame: reply
    timeout_s: 10.0
    hard_timeout_s: 120.0
    log_every: 1024
    stats_path: ${logger.log_dir}/enigmata_stats.jsonl
    stats_text_chars: 0
  # ScienceWorld: one JVM per worker (about 1.3 GB, heap 3 GB), started from the JRE and package in home. Reward is
  # the episode's last score / 100, clipped to [0, 1]; an episode the simulator loses is masked from the loss.
  scienceworld:
    num_workers: 32
    placement_group_prefix: grpo_inference_cluster
    java_path: /home01/hanint06/sciworld/jre/bin/java
    package_path: /home01/hanint06/sciworld/pydeps
    jvm_heap: 3g
    tokenizer_path: ${policy.model_name}
    simplifications: teleportAction,openDoors,openContainers,selfWateringFlowerPots
    max_actions: 50
    max_calls_per_turn: 1
    idle_timeout_s: 1800
    call_timeout_s: 300
    max_observation_chars: null
  # Open answers: the llm_judge environment (handover/openqa-judge-integration.md).
  llm_judge:
    judge_pool: judge
    mode: verdict
    score: hard
    min_verdict_mass: 0.0
    # vLLM structured outputs: the judge can only answer Yes or No.
    structured: true
    max_reasoning_chars: 400
    # A failed judge call makes its sample zero-weight instead of reward 0; nothing to judge stays reward 0.
    mask_failures: true
    reward_frame: claim
    fallback_frame: reply
    temperature: 1.0
    top_p: 1.0
    max_tokens: 512
    top_logprobs: 20
    max_concurrent_calls: 1024
    timeout_s: 300
    retries: 2
    pool_wait_s: 3600
    max_answer_chars: 2000
    log_every: 512
    chat_template_kwargs:
      enable_thinking: false
  judge_pool:
    num_nodes: 1
    stats_path: ${logger.log_dir}/judge_stats.jsonl
    stats_interval_s: 5.0
    generation:
      backend: vllm
      model_name: ${oc.env:SCRATCH}/models/gemma-4-26B-A4B-it
      max_new_tokens: 1024
      temperature: 1.0
      top_p: 1.0
      top_k: null
      val_temperature: 0.0
      val_top_p: 1.0
      val_top_k: null
      stop_token_ids: null
      stop_strings: null
      colocated:
        enabled: false
      vllm_cfg:
        async_engine: true
        expose_http_server: true
        precision: bfloat16
        kv_cache_dtype: auto
        logprobs_mode: processed_logprobs
        tensor_parallel_size: 1
        pipeline_parallel_size: 1
        expert_parallel_size: 1
        gpu_memory_utilization: 0.88
        max_model_len: 8192
        enforce_eager: false
        use_deep_gemm: false
        num_last_layers_in_bf16: 0
        num_first_layers_in_bf16: 0
        enable_vllm_metrics_logger: true
        vllm_metrics_logger_interval: 2.0
        refit_with_reload_api: false
        enable_prefix_caching: true
      vllm_kwargs:
        max_num_seqs: 256
        max_num_batched_tokens: 16384
