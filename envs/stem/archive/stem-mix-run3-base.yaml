# The run-3 STEM mix (DAPO-Math 128 / cleaned NuminaMath 256 / science and CS multiple choice 128 per
# step of 512) for a pretrained checkpoint without the Apertus 2 message format: the rows already
# carry their answer-line instruction, so the prompt is the row text and the reply is graded on its
# "Answer:" line. Validation as in run 3: AIME 2024 x32 and GPQA-Diamond x8.
defaults: ../../../recipes/apertus2-megachonk-vllm-adamw-stem16k.yaml

grpo:
  max_num_steps: 100
  max_num_epochs: 1
  val_period: 20
  val_batch_size: 2544
  max_val_samples: 2544

data:
  _override_: true
  max_input_seq_length: 2048
  shuffle: true
  num_workers: 1
  use_multiple_dataloader: true
  custom_dataloader: examples.custom_dataloader.custom_dataloader.example_custom_dataloader
  num_prompts_per_dataloader:
    DAPOMath17K: 128
    run3-numina_clean: 256
    run3-mcqa_science_cs: 128
  train:
    - dataset_name: DAPOMath17K
      deduplicate: true
    - dataset_name: ResponseDataset
      data_path: /scratch/hanint06/data/stem-rl/run3/numina_clean.jsonl
    - dataset_name: ResponseDataset
      data_path: /scratch/hanint06/data/stem-rl/run3/mcqa_science_cs.jsonl
      env_name: math_default
  validation:
    - dataset_name: DAPOMathAIME2024
      split: test
    - dataset_name: ResponseDataset
      data_path: /scratch/hanint06/data/stem-rl/gpqa_diamond_x8.jsonl
      env_name: math_default
  default:
    prompt_file: null
    processor: math_hf_data_processor
    env_name: math

env:
  math:
    num_workers: 8
    math_verify_impl: hf_math_verify
  math_default:
    num_workers: 8
    verifier_type: english_multichoice
