# Task file: Lean 4 theorem proving on an SFT checkpoint, with Gym math_formal_lean as it ships. The model
# gets a theorem statement and answers with a ```lean4 block; the reward is 1 if the proof compiles against
# Mathlib without sorry, else 0. Proofs compile in the NeMo-Skills sandbox (Lean 4 + Mathlib, arm64 image) on
# one intTest node of its own, started first:
#   bash backends/nemo-rl/lean/start.sh                      # prints the job; the node is in its log
#   bash backends/nemo-rl/lean/setup-data.sh                 # train and validation rows (one intTest job)
#   bash run.sh envs/lean-sft.yaml env.nemo_gym.math_formal_lean.resources_servers.math_formal_lean.sandbox_host=<node>
# Training rows: Nemotron-Math-Proofs-v1 selected by Gym prepare_nemotron_math_proofs.py with its defaults
# (hard, medium and easy theorems, not the ones used for Nano v3 SFT). Validation: miniF2F test, 244 theorems.
defaults: ../recipes/apertus2-chonk-sft-vllm-adamw-code.yaml
script: examples/nemo_gym/run_grpo_nemo_gym.py

grpo:
  num_prompts_per_step: 128
  num_generations_per_prompt: 16
  val_period: 20
  val_at_start: true
  val_at_end: true
  # The Gym entrypoint refuses any other value and validates on the whole validation file.
  max_val_samples: null
  val_batch_size: null
  val_num_generations_per_prompt: 1
  # The Gym entrypoint refuses reward shaping.
  reward_shaping:
    enabled: false
  skip_zero_advantage_groups: false

policy:
  train_global_batch_size: 512
  megatron_cfg:
    optimizer:
      lr: 2.0e-6
  generation:
    max_new_tokens: 16384
    # No budget: it slows vLLM generation 1.5-1.9x (see envs/code-gen-osb-sft.yaml).
    thinking_token_budget: null
    output_format: apertus2
    system_prompt_file: ${oc.env:RL_INFRA_DIR}/envs/apertus2-system.json
    stop_token_ids: [12]
    stop_strings: null
    vllm_cfg:
      max_model_len: ${policy.max_total_sequence_length}
      async_engine: true
      expose_http_server: true
      # The checkpoint tokenizer has no chat template, and the HTTP server does not use
      # policy.tokenizer.chat_template on its own.
      http_server_serving_chat_kwargs:
        chat_template: ${policy.tokenizer.chat_template}
    vllm_kwargs:
      # Chonk hybrid Mamba layers need it.
      enable_chunked_prefill: true

data:
  max_input_seq_length: null
  shuffle: true
  num_workers: 0
  # The data block below replaces the recipe one, and grpo.setup() indexes this key.
  use_multiple_dataloader: false
  train:
    dataset_name: NemoGymDataset
    data_path: ${oc.env:SCRATCH}/lean/data/train.jsonl
  validation:
    dataset_name: NemoGymDataset
    data_path: ${oc.env:SCRATCH}/lean/data/validation.jsonl
  default:
    dataset_name: NemoGymDataset
    env_name: nemo_gym
    prompt_file: null
    system_prompt_file: null
    processor: nemo_gym_data_processor
  _override_: true

env:
  should_use_nemo_gym: true
  should_log_nemo_gym_responses: true
  # Full results of every rollout, next to the weights. Never in W&B.
  rollout_dir: ${checkpointing.checkpoint_dir}/rollouts
  nemo_gym:
    skip_venv_if_present: true
    port_range_low: 5000
    port_range_high: 5999
    is_trajectory_collection: false
    # Gym servers live on several Ray nodes and must advertise the node IP.
    use_absolute_ip: true
    # NeMo-RL patch 0030: Gym agent server holds every request in flight; keep it off the trainer nodes.
    place_on_generation_node: true
    config_paths:
    - responses_api_models/vllm_model/configs/vllm_model_for_training.yaml
    - resources_servers/math_formal_lean/configs/math_formal_lean.yaml
    policy_model:
      responses_api_models:
        vllm_model:
          # NeMo-RL clears its own stop settings for Gym, so they travel with each request.
          extra_body:
            stop: []
            stop_token_ids: [12]
    math_formal_lean:
      resources_servers:
        math_formal_lean:
          # The node of the sandbox job (backends/nemo-rl/lean/start.sh), given at launch.
          sandbox_host: ???
          sandbox_port: 6000
          compilation_timeout: 30.0
  _override_: true

logger:
  tensorboard_enabled: true
